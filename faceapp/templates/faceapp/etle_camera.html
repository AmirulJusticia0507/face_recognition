{% extends 'faceapp/base.html' %}
{% block title %}ETLE Camera{% endblock %}
{% block content %}
<div class="container text-center mt-5">
  <h2 class="mb-4">ETLE Camera</h2>

  <div class="row justify-content-center">
    <div class="col-12">
      <video id="etleVideo" width="720" height="560" autoplay muted class="border rounded mb-3"></video>
      <canvas id="etleOverlay" width="720" height="560" class="position-absolute top-0 start-0"></canvas>
    </div>
  </div>

  <p id="violationStatus" class="mt-3 text-danger fw-bold"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script>
  const etleVideo = document.getElementById('etleVideo');
  const etleCanvas = document.getElementById('etleOverlay');
  const displaySize = { width: 720, height: 560 };

  async function setupCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    etleVideo.srcObject = stream;
  }

  async function loadModels() {
    await faceapi.nets.tinyFaceDetector.loadFromUri('/static/models/');
    await faceapi.nets.faceLandmark68Net.loadFromUri('/static/models/');
  }

  async function detectViolationLoop() {
    // Deteksi wajah dan kendaraan (ini contoh logika deteksi)
    const detections = await faceapi.detectAllFaces(etleVideo, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks();
    const resized = faceapi.resizeResults(detections, displaySize);
    
    // Update status pelanggaran
    if (resized.length > 0) {
      document.getElementById('violationStatus').textContent = 'Violation Detected';
    } else {
      document.getElementById('violationStatus').textContent = 'No violation detected';
    }

    // Render deteksi wajah pada canvas
    faceapi.draw.drawDetections(etleCanvas, resized);
    faceapi.draw.drawFaceLandmarks(etleCanvas, resized);
  }

  Promise.all([loadModels(), setupCamera()]).then(() => {
    etleVideo.onloadeddata = () => {
      setInterval(detectViolationLoop, 300);
    };
  });
</script>
{% endblock %}

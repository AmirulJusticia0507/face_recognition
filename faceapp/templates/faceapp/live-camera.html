{% extends 'faceapp/base.html' %}
{% block content %}
<div class="container mt-4 text-center">
  <h2>🎥 Live Camera Detection</h2>
  <video id="video" width="720" height="560" autoplay muted class="border rounded shadow"></video>
  <canvas id="overlay" width="720" height="560" class="position-absolute top-0 start-0"></canvas>
  <div class="mt-3">
    <button id="snapBtn" class="btn btn-primary">📸 Ambil Snapshot</button>
  </div>
  <div class="mt-4">
    <canvas id="expressionChart" width="400" height="300"></canvas>
  </div>
    
</div>

<div id="expressionDisplay" class="mt-2 text-muted"></div>

<!-- Modal untuk menampilkan hasil snapshot -->
<div id="snapshotModal" class="modal" tabindex="-1" role="dialog" aria-labelledby="snapshotModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="snapshotModalLabel">Snapshot</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" id="closeModalBtn">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body text-center">
        <img id="snapshotImage" src="" alt="Snapshot" class="img-fluid">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" id="closeModalBtn2">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Load face-api.js -->
<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const snapBtn = document.getElementById('snapBtn');
  const displaySize = { width: 720, height: 560 };
  const snapshotModal = document.getElementById('snapshotModal');
  const snapshotImage = document.getElementById('snapshotImage');
  const closeModalBtn = document.getElementById('closeModalBtn');
  let lastDetections = null;

  async function setupCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
  }

  async function loadModels() {
    await faceapi.nets.tinyFaceDetector.loadFromUri('/static/models/');
    await faceapi.nets.faceExpressionNet.loadFromUri('/static/models/');
    await faceapi.nets.faceLandmark68Net.loadFromUri('/static/models/');
    await faceapi.nets.faceRecognitionNet.loadFromUri('/static/models/');
  }

  function getDominantExpression(expressions) {
    return Object.entries(expressions).reduce((a, b) => a[1] > b[1] ? a : b)[0];
  }

  async function detectLoop() {
    const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks()
      .withFaceExpressions();

    lastDetections = detections;

    const resized = faceapi.resizeResults(detections, displaySize);
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    faceapi.draw.drawDetections(canvas, resized);
    faceapi.draw.drawFaceLandmarks(canvas, resized);
    faceapi.draw.drawFaceExpressions(canvas, resized);

    if (detections.length > 0) {
      const exp = getDominantExpression(detections[0].expressions);
      console.log("Ekspresi:", exp);
      document.getElementById('expressionDisplay').textContent = `Ekspresi Dominan: ${exp}`;
    }
  }

  snapBtn.addEventListener('click', async () => {
    const context = canvas.getContext('2d');
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageDataURL = canvas.toDataURL('image/jpeg');

    snapshotImage.src = imageDataURL;
    $('#snapshotModal').modal('show');

    let detected_expression = "unknown";
    if (lastDetections && lastDetections.length > 0) {
      const expressions = lastDetections[0].expressions;
      detected_expression = getDominantExpression(expressions);

      // Render Radar Chart
      const labels = Object.keys(expressions);
      const values = Object.values(expressions);
      const ctx = document.getElementById('expressionChart').getContext('2d');
      if (window.radarChart) window.radarChart.destroy(); // clear chart lama
      window.radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Ekspresi Wajah',
            data: values,
            backgroundColor: 'rgba(255, 99, 132, 0.2)',
            borderColor: 'rgba(255, 99, 132, 1)',
            pointBackgroundColor: 'rgba(255, 99, 132, 1)'
          }]
        },
        options: {
          scale: {
            ticks: { beginAtZero: true, max: 1 }
          }
        }
      });
    }

    // Simpan ke backend
    const response = await fetch('/live-camera/save-snapshot/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': '{{ csrf_token }}'
      },
      body: JSON.stringify({
        image_base64: imageDataURL,
        timestamp: new Date().toISOString(),
        detected_expression: detected_expression
      })
    });

    if (response.ok) {
      Swal.fire('Success', 'Snapshot berhasil disimpan ke history log!', 'success');
    }
  });

  closeModalBtn.addEventListener('click', () => {
    $('#snapshotModal').modal('hide');
  });

  Promise.all([loadModels(), setupCamera()]).then(() => {
    video.onloadeddata = () => {
      setInterval(detectLoop, 300);
    };
  });
</script>

{% endblock %}

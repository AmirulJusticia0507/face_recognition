services:
  - type: web
    name: face-recognition-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: FRONTEND_URL
        value: https://face-recognition-gamma-teal.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"

[app]
name = "face-recognition-nlhqxw"
primary_region = "ams"

[build]

[env]
PORT = "8080"
DJANGO_SETTINGS_MODULE = "core.settings"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[vm]]
memory = "2gb"
cpu_kind = "shared"
cpus = 1

[deploy]
release_command = "python manage.py migrate --noinput"
